[pytest]
testpaths = autotests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --allure-no-capture
markers =
    smoke: смоук-набор
    auth: тесты авторизации
    negative: негативные сценарии авторизации
    e2e: сквозные сценарии
    manual: тест требует ручного ввода (капча / SMS-код)
log_cli = false
log_cli_level = INFO
filterwarnings =
    ignore::DeprecationWarning
